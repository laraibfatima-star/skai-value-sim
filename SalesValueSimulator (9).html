                placeholder:text-gray-300 ${prefix ? "pl-7" : "pl-3"} ${suffix ? "pr-10" : "pr-3"}`}
            />
            {suffix && (
              <span className="absolute right-3 text-gray-400 text-sm select-none">{suffix}</span>
            )}
          </div>
          {note && <p className="text-xs text-skai-400 italic">{note}</p>}
        </div>
      );
    }

    function KpiCard({ label, value, sub, highlight, tooltip }) {
      return (
        <div className={`rounded-xl border p-4 ${highlight ? "border-skai-200 bg-skai-50" : "border-gray-200 bg-white"}`}>
          <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1 flex items-center">
            {label}
            {tooltip && <Tooltip text={tooltip} />}
          </p>
          <p className={`text-2xl font-bold ${highlight ? "text-skai-700" : "text-gray-800"}`}>{value}</p>
          {sub && <p className="text-xs text-gray-400 mt-1">{sub}</p>}
        </div>
      );
    }

    const CH_STYLE = {
      search: { ring: "border-skai-300 bg-skai-50",         badge: "bg-skai-100 text-skai-700",         dot: "bg-skai-500" },
      social: { ring: "border-sky-teal-300 bg-sky-teal-50", badge: "bg-sky-teal-100 text-sky-teal-600", dot: "bg-sky-teal-500" },
      retail: { ring: "border-emerald-300 bg-emerald-50",   badge: "bg-emerald-100 text-emerald-700",   dot: "bg-emerald-400" },
    };

    function ToolbarBtn({ onClick, title, children, danger }) {
      return (
        <button
          onClick={onClick}
          title={title}
          className={`px-2.5 py-1 rounded-md border text-xs font-semibold transition-all
            ${danger
              ? "border-red-200 text-red-600 bg-white hover:bg-red-50"
              : "border-gray-200 text-gray-600 bg-white hover:bg-gray-50 hover:border-gray-300"}`}
        >
          {children}
        </button>
      );
    }

    const TONE_TEXT = {
      good: "text-emerald-600", ok: "text-emerald-600",
      warn: "text-[#FFB900]",  bad: "text-[#FF8161]", none: "text-gray-400",
    };

    function FeasibilityBar({ stat }) {
      if (!stat || !stat.bins || !stat.bins.length) return null;
      const sty = CH_STYLE[stat.channel] || {};
      const def = CHANNELS_DEF.find((c) => c.id === stat.channel);
      return (
        <div className="flex items-center gap-2 mt-1.5">
          <span className="w-5 text-center text-sm flex-shrink-0" title={def ? def.label : ""}>
            {def ? def.icon : ""}
          </span>
          <div className="relative flex items-end gap-px h-6 flex-1 min-w-0">
            {stat.bins.map((b, i) => {
              const good =
                stat.pct != null &&
                (stat.dir === "le" ? b.x1 <= stat.target + 1e-9 : b.x0 >= stat.target - 1e-9);
              return (
                <div
                  key={i}
                  className={`flex-1 rounded-sm ${good ? (sty.dot || "bg-skai-400") : "bg-gray-200"}`}
                  style={{ height: `${Math.max(6, b.frac * 100)}%` }}
                />
              );
            })}
            <div
              className="absolute top-0 bottom-0 w-0.5 bg-gray-800"
              style={{ left: `${stat.markerFrac * 100}%` }}
              title="Your projection"
            />
          </div>
          <div className="w-44 flex-shrink-0 text-right leading-tight">
            {stat.pct == null ? (
              <span className="text-xs text-gray-400">baseline</span>
            ) : (
              <span className="text-xs text-gray-500">
                <span className="font-semibold text-gray-700">{stat.pct}%</span> did this{" "}
                {stat.verdict && <span className={`font-semibold ${TONE_TEXT[stat.verdict.tone]}`}>· {stat.verdict.label}</span>}
              </span>
            )}
          </div>
        </div>
      );
    }

    function SalesValueSimulator() {
      const [step, setStep] = useState(1);

      const [selChannels, setSelChannels] = useState(["search", "social"]);
      const [kpi, setKpi]       = useState("cpa");
      const [period, setPeriod] = useState("annually");

      const [fees,  setFees]  = useState({ proposed: 345000 });
      const [spend, setSpend] = useState({ search: 7000000, social: 12000000, retail: 0 });

      const [um, setUm] = useState({
        search: { cpc: "", ctr: "", cvr: "", aov: "" },
        social: { cpm: "", ctr: "", cvr: "", aov: "" },
        retail: { cpc: "", ctr: "", cvr: "", aov: "" },
      });

      const [sc, setSc] = useState({ cvr: 0, cpc: 0, aov: 0 });

      const [scenarios, setScenarios]       = useState([]);
      const [scenarioName, setScenarioName] = useState("");
      const [compareIds, setCompareIds]     = useState([]);
      const [showShareToast, setShowShareToast] = useState(false);
      const [hydrated, setHydrated]         = useState(false);

      useEffect(() => {
        let restoredFromUrl = false;
        try {
          const params = new URLSearchParams(window.location.search);
          const s = params.get("s");
          if (s) {
            const decoded = decodeState(s);
            if (decoded) {
              applyState(decoded);
              restoredFromUrl = true;
            }
          }
          if (!restoredFromUrl) {
            const saved = localStorage.getItem(LS_STATE_KEY);
            if (saved) applyState(JSON.parse(saved));
          }
          const sc2 = localStorage.getItem(LS_SCENARIOS_KEY);
          if (sc2) {
            const parsed = JSON.parse(sc2);
            if (Array.isArray(parsed)) setScenarios(parsed);
          }
        } catch (err) {
          console.warn("Hydration failed:", err);
        }
        setHydrated(true);
      }, []);

      useEffect(() => {
        if (!hydrated) return;
        try {
          localStorage.setItem(LS_STATE_KEY, JSON.stringify({ selChannels, kpi, period, fees, spend, um, sc }));
        } catch (e) {}
      }, [hydrated, selChannels, kpi, period, fees, spend, um, sc]);

      useEffect(() => {
        if (!hydrated) return;
        try {
          localStorage.setItem(LS_SCENARIOS_KEY, JSON.stringify(scenarios));
        } catch (e) {}
      }, [hydrated, scenarios]);

      function applyState(s) {
        if (!s || typeof s !== "object") return;
        if (Array.isArray(s.selChannels) && s.selChannels.length) setSelChannels(s.selChannels);
        if (s.kpi && KPIS.some((k) => k.id === s.kpi)) setKpi(s.kpi);
        if (s.period === "annually" || s.period === "monthly") setPeriod(s.period);
        if (s.fees && typeof s.fees === "object") setFees(s.fees);
        if (s.spend && typeof s.spend === "object") setSpend((prev) => Object.assign({}, prev, s.spend));
        if (s.um && typeof s.um === "object") setUm((prev) => Object.assign({}, prev, s.um));
        if (s.sc && typeof s.sc === "object") setSc(s.sc);
      }

      function currentSnapshot() {
        return { selChannels, kpi, period, fees, spend, um, sc };
      }

      function saveScenario() {
        const name = scenarioName.trim() || `Scenario ${scenarios.length + 1}`;
        const newScenario = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name,
          savedAt: Date.now(),
          snapshot: currentSnapshot(),
        };
        setScenarios((prev) => [newScenario, ...prev]);
        setScenarioName("");
      }

      function loadScenario(id) {
        const found = scenarios.find((x) => x.id === id);
        if (found) {
          applyState(found.snapshot);
          setStep(4);
        }
      }

      function deleteScenario(id) {
        setScenarios((prev) => prev.filter((s) => s.id !== id));
        setCompareIds((prev) => prev.filter((sid) => sid !== id));
      }

      function renameScenario(id, name) {
        setScenarios((prev) => prev.map((s) => (s.id === id ? Object.assign({}, s, { name }) : s)));
      }

      function toggleCompare(id) {
        setCompareIds((prev) => {
          if (prev.includes(id)) return prev.filter((x) => x !== id);
          if (prev.length >= 2) return [prev[1], id];
          return [...prev, id];
        });
      }

      function copyShareLink() {
        const encoded = encodeState(currentSnapshot());
        const url = `${window.location.origin}${window.location.pathname}?s=${encoded}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(
            () => {
              setShowShareToast(true);
              setTimeout(() => setShowShareToast(false), 2500);
            },
            () => window.prompt("Copy this share link:", url)
          );
        } else {
          window.prompt("Copy this share link:", url);
        }
      }

      function exportPdf() {
        setStep(4);
        setTimeout(() => window.print(), 100);
      }

      function resetAll() {
        if (!window.confirm("Reset all inputs and clear saved scenarios? This cannot be undone.")) return;
        setSelChannels(["search", "social"]);
        setKpi("cpa");
        setPeriod("annually");
        setFees({ proposed: 345000 });
        setSpend({ search: 7000000, social: 12000000, retail: 0 });
        setUm({
          search: { cpc: "", ctr: "", cvr: "", aov: "" },
          social: { cpm: "", ctr: "", cvr: "", aov: "" },
          retail: { cpc: "", ctr: "", cvr: "", aov: "" },
        });
        setSc({ cvr: 0, cpc: 0, aov: 0 });
        setScenarios([]);
        setCompareIds([]);
        setStep(1);
        try {
          localStorage.removeItem(LS_STATE_KEY);
          localStorage.removeItem(LS_SCENARIOS_KEY);
        } catch (e) {}
      }

      const R = useMemo(() => {
        const base = computeAll({ selChannels, period, fees, spend, um });

        const breakevenCvr = base.totRev > 0 ? (base.fee / base.totRev) * 100 : null;
        const breakevenCpc = base.totSpend > 0 ? (base.fee / base.totSpend) * 100 : null;

        const cvrFactor = 1 + sc.cvr / 100;
        const cpcFactor = 1 + sc.cpc / 100; // CPC change moves spend only: same clicks, conversions and revenue
        const aovFactor = 1 + sc.aov / 100;

        const scConv = base.totConv * cvrFactor;
        const scSpend = base.totSpend * cpcFactor;
        const baseAov = base.totConv > 0 ? base.totRev / base.totConv : 0;
        const scRev   = scConv * baseAov * aovFactor;
        const scCpa   = scSpend > 0 && scConv > 0 ? scSpend / scConv : null;
        const scRoas  = scSpend > 0 ? scRev / scSpend : null;
        const scAcos  = scRev > 0 ? scSpend / scRev : null;
        const scInclCpa  = scConv > 0 ? (scSpend + base.fee) / scConv : null;
        const scInclAcos = scRev > 0 ? (scSpend + base.fee) / scRev : null;

        return Object.assign({}, base, {
          breakevenCvr, breakevenCpc,
          sc: { conv: scConv, rev: scRev, cpa: scCpa, roas: scRoas, acos: scAcos, inclCpa: scInclCpa, inclAcos: scInclAcos },
        });
      }, [selChannels, spend, um, fees, period, sc]);

      const compareData = useMemo(() => {
        return compareIds
          .map((id) => {
            const s = scenarios.find((x) => x.id === id);
            if (!s) return null;
            return { scenario: s, metrics: computeAll(s.snapshot) };
          })
          .filter(Boolean);
      }, [compareIds, scenarios]);

      const toggleChannel = (ch) =>
        setSelChannels((prev) =>
          prev.includes(ch)
            ? prev.length > 1 ? prev.filter((c) => c !== ch) : prev
            : [...prev, ch]
        );

      const totalInputSpend = Object.entries(spend)
        .filter(([k]) => selChannels.includes(k))
        .reduce((a, [, v]) => a + (v || 0), 0);

      const scenarioActive = sc.cvr !== 0 || sc.cpc !== 0 || sc.aov !== 0;

      const renderKpiCards = () => {
        if (kpi === "cpa") {
          return (
            <React.Fragment>
              <KpiCard label="CPA — Media Only"     value={fmt.$(R.blendCpa)} sub="cost per conversion"
                tooltip="What each conversion costs using media spend alone — no Skai fee included." />
              <KpiCard label="CPA — incl. Skai Fee" value={fmt.$(R.inclCpa)}  sub="cost per conversion" highlight
                tooltip="What each conversion costs when you factor in the Skai platform fee. This is the true all-in cost to acquire a customer." />
            </React.Fragment>
          );
        }
        if (kpi === "roas") {
          return (
            <React.Fragment>
              <KpiCard label="ROAS — Media Only"     value={fmt.x(R.blendRoas)} sub="revenue per $ spent"
                tooltip="Revenue generated for every dollar of media spend, before accounting for the Skai fee." />
              <KpiCard label="ROAS — incl. Skai Fee" value={fmt.x(R.inclRoas)}  sub="revenue per $ spent" highlight
                tooltip="Revenue per dollar of total investment — media spend plus the Skai fee combined." />
            </React.Fragment>
          );
        }
        return (
          <React.Fragment>
            <KpiCard label="ACOS — Media Only"      value={fmt.acos(R.blendAcos)} sub="ad spend ÷ revenue"
              tooltip="Advertising Cost of Sales using media spend only. Lower % = more efficient. Common in Amazon/retail media." />
            <KpiCard label="TACOS — incl. Skai Fee" value={fmt.acos(R.inclAcos)}  sub="total cost ÷ revenue" highlight
              tooltip="Total Advertising Cost of Sales — includes both media spend and the Skai fee in the numerator. The true efficiency metric for retail media." />
          </React.Fragment>
        );
      };

      const renderRowKpi = (r) => {
        if (kpi === "cpa")  return fmt.$(r.cpa);
        if (kpi === "roas") return fmt.x(r.roas);
        return fmt.acos(r.acos);
      };

      const renderTotalKpi = () => {
        if (kpi === "cpa")  return fmt.$(R.blendCpa);
        if (kpi === "roas") return fmt.x(R.blendRoas);
        return fmt.acos(R.blendAcos);
      };

      const kpiColumnLabel = kpi === "cpa" ? "CPA" : kpi === "roas" ? "ROAS" : "ACOS";

      const scenarioImpactKpi = (() => {
        if (kpi === "cpa")  return { label: "CPA",  base: R.blendCpa,  sc: R.sc.cpa,  fmtFn: fmt.$,    goodIfHigher: false };
        if (kpi === "roas") return { label: "ROAS", base: R.blendRoas, sc: R.sc.roas, fmtFn: fmt.x,    goodIfHigher: true  };
        return                  { label: "ACOS", base: R.blendAcos, sc: R.sc.acos, fmtFn: fmt.acos, goodIfHigher: false };
      })();

      return (
        <div className="min-h-screen bg-gray-50" style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>
          <style>{`
            @media print {
              .no-print { display: none !important; }
              body { background: #ffffff !important; }
              * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            }
          `}</style>

          {/* Internal use only banner */}
          <div className="bg-amber-50 border-b border-amber-200 px-6 py-2 no-print">
            <div className="max-w-2xl mx-auto flex items-center gap-2">
              <span className="text-amber-600 text-sm">⚠️</span>
              <p className="text-xs text-amber-700 font-semibold">
                Internal use only — for Skai sellers and industry leads. Do not share this tool or its raw outputs directly with clients. Use results in a slide or present live.
              </p>
            </div>
          </div>

          {/* Top bar */}
          <div className="bg-white border-b border-gray-200 px-6 py-3 sticky top-0 z-10 no-print">
            <div className="max-w-2xl mx-auto flex items-center justify-between gap-3 flex-wrap">
              <div className="flex items-center gap-2 min-w-0">

                    <span className="text-xs text-gray-400">{scenarios.length} saved</span>
                  </div>
                  <p className="text-xs text-gray-400 mb-4">
                    Save the current configuration with a name, then tick any two to compare them side-by-side.
                  </p>

                  <div className="flex gap-2 mb-4">
                    <input
                      type="text"
                      value={scenarioName}
                      onChange={(e) => setScenarioName(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") saveScenario(); }}
                      placeholder={`Scenario name (e.g. "Acme — Q3 pitch")`}
                      className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-skai-300 focus:border-skai-400"
                    />
                    <button
                      onClick={saveScenario}
                      className="px-4 py-2 rounded-lg text-sm font-semibold bg-skai-600 text-white hover:bg-skai-700 shadow-sm"
                    >
                      + Save current
                    </button>
                  </div>

                  {scenarios.length === 0 ? (
                    <p className="text-xs text-gray-400 italic text-center py-3">
                      No saved scenarios yet — save the current setup to start comparing.
                    </p>
                  ) : (
                    <ul className="space-y-2">
                      {scenarios.map((s) => {
                        const checked = compareIds.includes(s.id);
                        const m = computeAll(s.snapshot);
                        return (
                          <li key={s.id} className={`rounded-lg border p-3 transition-all
                            ${checked ? "border-skai-300 bg-skai-50/50" : "border-gray-200 bg-white"}`}>
                            <div className="flex items-center gap-3">
                              <input
                                type="checkbox"
                                checked={checked}
                                onChange={() => toggleCompare(s.id)}
                                className="w-4 h-4 accent-skai-600 flex-shrink-0"
                                title="Add to compare (max 2)"
                              />
                              <div className="flex-1 min-w-0">
                                <input
                                  type="text"
                                  value={s.name}
                                  onChange={(e) => renameScenario(s.id, e.target.value)}
                                  className="w-full bg-transparent font-semibold text-sm text-gray-800
                                    border-0 border-b border-transparent hover:border-gray-200
                                    focus:outline-none focus:border-skai-400 px-0 py-0.5"
                                />
                                <p className="text-xs text-gray-400 mt-0.5">
                                  {fmt.date(s.savedAt)} · {(s.snapshot.selChannels || []).join(" + ")} · {String(s.snapshot.kpi || "cpa").toUpperCase()}
                                </p>
                              </div>
                              <div className="flex flex-col items-end flex-shrink-0">
                                <span className="text-xs font-semibold text-gray-700">{fmt.$(m.totRev)}</span>
                                <span className="text-[10px] text-gray-400">revenue</span>
                              </div>
                              <div className="flex gap-1 flex-shrink-0">
                                <button
                                  onClick={() => loadScenario(s.id)}
                                  className="px-2 py-1 rounded text-xs font-semibold text-skai-600 hover:bg-skai-100"
                                  title="Load this scenario into the form"
                                >
                                  Load
                                </button>
                                <button
                                  onClick={() => deleteScenario(s.id)}
                                  className="px-2 py-1 rounded text-xs font-semibold text-red-500 hover:bg-red-50"
                                  title="Delete"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>
                          </li>
                        );
                      })}
                    </ul>
                  )}

                  {compareData.length === 2 && (
                    <div className="mt-5 pt-5 border-t border-gray-100">
                      <div className="flex items-center justify-between mb-3">
                        <p className="text-xs font-bold text-gray-400 uppercase tracking-wider">Side-by-side compare</p>
                        <button
                          onClick={() => setCompareIds([])}
                          className="text-xs text-gray-400 hover:text-gray-600"
                        >
                          Clear
                        </button>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                          <thead>
                            <tr className="text-xs text-gray-400 uppercase tracking-wider border-b border-gray-100">
                              <th className="text-left pb-2 font-semibold">Metric</th>
                              <th className="text-right pb-2 font-semibold truncate max-w-[120px]" title={compareData[0].scenario.name}>
                                {compareData[0].scenario.name}
                              </th>
                              <th className="text-right pb-2 font-semibold truncate max-w-[120px]" title={compareData[1].scenario.name}>
                                {compareData[1].scenario.name}
                              </th>
                              <th className="text-right pb-2 font-semibold">Δ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-50">
                            {[
                              { label: "Total Spend",       a: compareData[0].metrics.totSpend, b: compareData[1].metrics.totSpend, fmtFn: fmt.$,    goodIfHigher: false },
                              { label: "Platform Fee",      a: compareData[0].metrics.fee,      b: compareData[1].metrics.fee,      fmtFn: fmt.$,    goodIfHigher: false },
                              { label: "Conversions",       a: compareData[0].metrics.totConv,  b: compareData[1].metrics.totConv,  fmtFn: fmt.n,    goodIfHigher: true  },
                              { label: "Revenue",           a: compareData[0].metrics.totRev,   b: compareData[1].metrics.totRev,   fmtFn: fmt.$,    goodIfHigher: true  },
                              { label: "CPA (media)",       a: compareData[0].metrics.blendCpa, b: compareData[1].metrics.blendCpa, fmtFn: fmt.$,    goodIfHigher: false },
                              { label: "ROAS (media)",      a: compareData[0].metrics.blendRoas,b: compareData[1].metrics.blendRoas,fmtFn: fmt.x,    goodIfHigher: true  },
                              { label: "ACOS (media)",      a: compareData[0].metrics.blendAcos,b: compareData[1].metrics.blendAcos,fmtFn: fmt.acos, goodIfHigher: false },
                              { label: "TACOS (incl. fee)", a: compareData[0].metrics.inclAcos, b: compareData[1].metrics.inclAcos, fmtFn: fmt.acos, goodIfHigher: false },
                            ].map(({ label, a, b, fmtFn, goodIfHigher }) => {
                              const delta = a != null && a !== 0 ? ((b - a) / a) * 100 : null;
                              const improved = delta != null && (goodIfHigher ? delta > 0 : delta < 0);
                              return (
                                <tr key={label}>
                                  <td className="py-2 text-gray-600">{label}</td>
                                  <td className="py-2 text-right text-gray-700">{fmtFn(a)}</td>
                                  <td className="py-2 text-right text-gray-700">{fmtFn(b)}</td>
                                  <td className={`py-2 text-right font-semibold ${
                                    delta == null ? "text-gray-300"
                                    : improved ? "text-emerald-600"
                                    : delta === 0 ? "text-gray-400"
                                    : "text-red-500"}`}>
                                    {delta == null ? "—" : fmt.delta(delta)}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {compareData.length === 1 && (
                    <p className="mt-4 text-xs text-skai-500 text-center italic">
                      Select one more scenario to compare side-by-side.
                    </p>
                  )}
                </div>

                <p className="text-xs text-gray-300 text-center">
                  For informational purposes only. Results based on inputs and Q3 2026 benchmarks — actual performance may vary.
                </p>
              </React.Fragment>
            )}

            {/* Navigation */}
            <div className="flex justify-between items-center pt-4 border-t border-gray-200 no-print">
              <button
                onClick={() => setStep((s) => Math.max(1, s - 1))}
                className={`px-5 py-2.5 rounded-lg text-sm font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all
                  ${step === 1 ? "invisible" : ""}`}
              >
                ← Back
              </button>

              {step < 4 ? (
                <button
                  onClick={() => setStep((s) => s + 1)}
                  className="px-6 py-2.5 rounded-lg text-sm font-semibold bg-skai-600 text-white hover:bg-skai-700 shadow-sm transition-all"
                >
                  Next →
                </button>
              ) : (
                <button
                  onClick={copyShareLink}
                  className="px-6 py-2.5 rounded-lg text-sm font-semibold bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition-all"
                >
                  ↗ Copy Share Link
                </button>
              )}
            </div>
          </div>

          {showShareToast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-20 no-print">
              ✓ Share link copied to clipboard
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SalesValueSimulator />);
  </script>
</body>
</html>
